<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FinPulse AI - Login</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="auth-container">

        <div class="auth-card">

            <h1>FinPulse AI</h1>

            <p>Login to your financial dashboard</p>


            <!-- LOGIN -->

            <h2>Login</h2>

            <input
                type="email"
                id="loginEmail"
                placeholder="Email"
            >

            <input
                type="password"
                id="loginPassword"
                placeholder="Password"
            >

            <button
                type="button"
                onclick="loginUser()"
            >
                Login
            </button>


            <hr>


            <!-- SIGNUP -->

            <h2>Create Account</h2>

            <input
                type="text"
                id="signupName"
                placeholder="Full Name"
            >

            <input
                type="email"
                id="signupEmail"
                placeholder="Email"
            >

            <input
                type="password"
                id="signupPassword"
                placeholder="Password"
            >

            <button
                type="button"
                onclick="signupUser()"
            >
                Create Account
            </button>


            <!-- MESSAGE -->

            <div id="authResult"></div>

        </div>

    </div>


    <script src="./auth.js"></script>

</body>

</html>
